<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Familien-Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    [x-cloak] { display: none; }
  </style>
</head>
<body class="bg-gray-900 text-white h-screen overflow-hidden flex flex-col select-none">

  <!-- Four-panel layout -->
  <div class="flex flex-1 gap-4 p-4 min-h-0">

    <!-- Heute (30%) -->
    <div class="flex-[3] bg-gray-800 rounded-2xl p-6 flex flex-col min-h-0">
      <h2 class="text-3xl font-bold mb-4 text-blue-300">📅 Heute</h2>
      <div
        id="panel-wetter"
        hx-get="/api/weather"
        hx-trigger="load, every 300s"
        hx-swap="innerHTML"
        hx-headers='{"HX-Request": "true"}'
      ></div>
      <div
        id="panel-heute"
        class="flex-1 overflow-y-auto"
        hx-get="/api/today"
        hx-trigger="load, every 300s"
        hx-swap="innerHTML"
        hx-headers='{"HX-Request": "true"}'
      >
        <p class="text-xl text-gray-500 animate-pulse">Laden…</p>
      </div>
    </div>

    <!-- Diese Woche (30%) -->
    <div class="flex-[3] bg-gray-800 rounded-2xl p-6 flex flex-col min-h-0">
      <h2 class="text-3xl font-bold mb-4 text-green-300">🗓 Diese Woche</h2>
      <div
        id="panel-woche"
        class="flex-1 overflow-y-auto"
        hx-get="/api/week"
        hx-trigger="load, every 300s"
        hx-swap="innerHTML"
        hx-headers='{"HX-Request": "true"}'
      >
        <p class="text-xl text-gray-500 animate-pulse">Laden…</p>
      </div>
    </div>

    <!-- Einkauf (20%) -->
    <div class="flex-[2] bg-gray-800 rounded-2xl p-6 flex flex-col min-h-0">
      <h2 class="text-3xl font-bold mb-4 text-yellow-300">🛒 Einkauf</h2>
      <div
        id="panel-einkauf"
        class="flex-1 overflow-y-auto"
        hx-get="/api/grocery"
        hx-trigger="load, every 300s"
        hx-swap="innerHTML"
        hx-headers='{"HX-Request": "true"}'
      >
        <p class="text-xl text-gray-500 animate-pulse">Laden…</p>
      </div>
    </div>

    <!-- Notizen (20%) -->
    <div class="flex-[2] bg-gray-800 rounded-2xl p-6 flex flex-col min-h-0">
      <h2 class="text-3xl font-bold mb-4 text-pink-300">📌 Notizen</h2>
      <div
        id="panel-notizen"
        class="flex-1 overflow-y-auto"
        hx-get="/api/notes"
        hx-trigger="load, every 30s"
        hx-swap="innerHTML"
        hx-headers='{"HX-Request": "true"}'
      >
        <p class="text-lg text-gray-500 animate-pulse">Laden…</p>
      </div>
    </div>

  </div>

  <!-- Footer: last updated clock -->
  <div
    class="text-center text-gray-600 text-sm pb-3"
    x-data="{ time: '' }"
    x-init="
      const fmt = () => new Date().toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
      time = fmt();
      setInterval(() => time = fmt(), 60000);
    "
    x-cloak
  >
    Zuletzt aktualisiert: <span x-text="time"></span>
  </div>

</body>
</html>
