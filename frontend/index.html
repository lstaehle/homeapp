<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Familien-Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.store('meal', {
        open: false,
        date: '',
        meals: [],
        newMeal: '',
        async openFor(date) {
          this.date = date;
          this.newMeal = '';
          this.open = true;
          const r = await fetch('/api/meals');
          const data = await r.json();
          this.meals = data.list; // [{name, ingredients}]
        },
        async select(meal) {
          const mealName = typeof meal === 'string' ? meal : meal.name;
          await fetch('/api/meals/plan/' + this.date, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({meal: mealName})
          });
          this.open = false;
          htmx.trigger(document.getElementById('panel-heute'), 'refresh');
          htmx.trigger(document.getElementById('panel-woche'), 'refresh');
        },
        async addNew() {
          const meal = this.newMeal.trim();
          if (!meal) return;
          await fetch('/api/meals/list', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({meal: meal})
          });
          this.meals.push({name: meal, ingredients: []});
          this.newMeal = '';
        },
        async remove(date) {
          await fetch('/api/meals/plan/' + date, {method: 'DELETE'});
          htmx.trigger(document.getElementById('panel-heute'), 'refresh');
          htmx.trigger(document.getElementById('panel-woche'), 'refresh');
        }
      });

      Alpine.store('mealConfig', {
        open: false,
        meals: [],
        sections: [],
        selected: null,
        newIngredient: '',
        newMealName: '',
        async openConfig() {
          const [configR, sectionsR] = await Promise.all([
            fetch('/api/meals/config'),
            fetch('/api/todoist/sections')
          ]);
          this.meals = await configR.json();
          this.sections = await sectionsR.json();
          this.selected = null;
          this.newIngredient = '';
          this.newMealName = '';
          this.open = true;
        },
        selectMeal(meal) {
          this.selected = {name: meal.name, ingredients: meal.ingredients.map(i => ({...i}))};
          this.newIngredient = '';
        },
        async addMeal() {
          const name = this.newMealName.trim();
          if (!name) return;
          await fetch('/api/meals/list', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({meal: name})
          });
          this.meals.push({name, ingredients: []});
          this.meals.sort((a, b) => a.name.localeCompare(b.name));
          this.newMealName = '';
        },
        async removeMeal(mealName) {
          await fetch('/api/meals/list/' + encodeURIComponent(mealName), {method: 'DELETE'});
          this.meals = this.meals.filter(m => m.name !== mealName);
          if (this.selected?.name === mealName) this.selected = null;
        },
        async addIngredient() {
          const ing = this.newIngredient.trim();
          if (!ing || !this.selected) return;
          this.selected.ingredients.push({name: ing, section_id: null});
          this.selected.ingredients.sort((a, b) => a.name.localeCompare(b.name));
          this.newIngredient = '';
          await this.save();
        },
        async removeIngredient(i) {
          this.selected.ingredients.splice(i, 1);
          await this.save();
        },
        setSection(i, sectionId) {
          this.selected.ingredients[i].section_id = sectionId || null;
          this.save();
        },
        async save() {
          await fetch('/api/meals/config/' + encodeURIComponent(this.selected.name), {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ingredients: this.selected.ingredients})
          });
          const m = this.meals.find(m => m.name === this.selected.name);
          if (m) m.ingredients = this.selected.ingredients.map(i => ({...i}));
        }
      });
    });
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    [x-cloak] { display: none; }
  </style>
</head>
<body class="bg-gray-900 text-white h-screen overflow-hidden flex flex-col select-none">

  <!-- Meal planning modal -->
  <div x-data x-show="$store.meal.open" x-cloak
       @click.self="$store.meal.open = false"
       class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center">
    <div class="bg-gray-800 rounded-2xl p-6 w-80 max-h-[80vh] flex flex-col shadow-2xl">
      <h3 class="text-2xl font-bold mb-4">🍽 Mahlzeit wählen</h3>
      <div class="flex-1 overflow-y-auto mb-4">
        <div class="grid grid-cols-2 gap-2">
          <template x-for="meal in $store.meal.meals" :key="meal.name">
            <button @click="$store.meal.select(meal)"
                    class="bg-gray-700 hover:bg-blue-600 rounded-xl px-3 py-2 text-left text-base transition-colors"
                    x-text="meal.name"></button>
          </template>
        </div>
      </div>
      <div class="border-t border-gray-600 pt-4">
        <div class="flex gap-2 mb-3">
          <input x-model="$store.meal.newMeal"
                 @keydown.enter="$store.meal.addNew()"
                 placeholder="Neue Mahlzeit…"
                 class="flex-1 bg-gray-700 rounded-xl px-3 py-2 text-base outline-none focus:ring-2 focus:ring-blue-500" />
          <button @click="$store.meal.addNew()"
                  class="bg-green-700 hover:bg-green-600 rounded-xl px-4 py-2 text-base transition-colors">+</button>
        </div>
        <button @click="$store.meal.open = false"
                class="w-full text-gray-500 hover:text-gray-300 text-sm transition-colors">Abbrechen</button>
      </div>
    </div>
  </div>

  <!-- Meal config modal -->
  <div x-data x-show="$store.mealConfig.open" x-cloak
       @click.self="$store.mealConfig.open = false"
       class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center">
    <div class="bg-gray-800 rounded-2xl shadow-2xl flex w-[720px] max-h-[80vh]" style="min-height:400px">

      <!-- Left: meal list -->
      <div class="w-56 border-r border-gray-700 flex flex-col p-4">
        <p class="text-lg font-bold mb-3">⚙️ Mahlzeiten</p>
        <div class="flex-1 overflow-y-auto space-y-1">
          <template x-for="meal in $store.mealConfig.meals" :key="meal.name">
            <div class="flex items-center gap-1">
              <button @click="$store.mealConfig.selectMeal(meal)"
                      :class="$store.mealConfig.selected?.name === meal.name
                        ? 'bg-blue-600 text-white'
                        : 'bg-gray-700 hover:bg-gray-600 text-gray-200'"
                      class="flex-1 text-left rounded-lg px-3 py-2 text-base transition-colors truncate"
                      x-text="meal.name"></button>
              <button @click="$store.mealConfig.removeMeal(meal.name)"
                      class="text-gray-600 hover:text-red-400 text-lg leading-none flex-shrink-0 transition-colors">×</button>
            </div>
          </template>
        </div>
        <div class="flex gap-1 mt-2 pt-2 border-t border-gray-700">
          <input x-model="$store.mealConfig.newMealName"
                 @keydown.enter="$store.mealConfig.addMeal()"
                 placeholder="Neue Mahlzeit…"
                 class="flex-1 bg-gray-700 rounded-lg px-2 py-1 text-sm outline-none focus:ring-1 focus:ring-blue-500 min-w-0" />
          <button @click="$store.mealConfig.addMeal()"
                  class="bg-green-700 hover:bg-green-600 rounded-lg px-3 py-1 text-base transition-colors flex-shrink-0">+</button>
        </div>
      </div>

      <!-- Right: ingredient editor -->
      <div class="flex-1 flex flex-col p-5">
        <div x-show="!$store.mealConfig.selected" class="text-gray-500 text-base mt-4">
          Mahlzeit auswählen, um Zutaten zu bearbeiten.
        </div>
        <div x-show="$store.mealConfig.selected" class="flex flex-col h-full">
          <p class="text-xl font-bold mb-3" x-text="$store.mealConfig.selected?.name"></p>
          <div class="flex-1 overflow-y-auto mb-3 space-y-1">
            <template x-for="(ing, i) in $store.mealConfig.selected?.ingredients ?? []" :key="i">
              <div class="flex items-center gap-2 bg-gray-700 rounded-lg px-3 py-2">
                <span class="text-base flex-1" x-text="ing.name"></span>
                <select @change="$store.mealConfig.setSection(i, $event.target.value)"
                        class="bg-gray-600 rounded-lg px-2 py-1 text-sm text-gray-200 max-w-[130px]">
                  <option value="">Kein Bereich</option>
                  <template x-for="sec in $store.mealConfig.sections" :key="sec.id">
                    <option :value="sec.id"
                            :selected="ing.section_id === sec.id"
                            x-text="sec.name"></option>
                  </template>
                </select>
                <button @click="$store.mealConfig.removeIngredient(i)"
                        class="text-gray-500 hover:text-red-400 text-lg leading-none flex-shrink-0">×</button>
              </div>
            </template>
            <p x-show="($store.mealConfig.selected?.ingredients ?? []).length === 0"
               class="text-gray-500 text-sm">Noch keine Zutaten.</p>
          </div>
          <div class="flex gap-2 border-t border-gray-700 pt-3">
            <input x-model="$store.mealConfig.newIngredient"
                   @keydown.enter="$store.mealConfig.addIngredient()"
                   placeholder="Zutat hinzufügen…"
                   class="flex-1 bg-gray-700 rounded-xl px-3 py-2 text-base outline-none focus:ring-2 focus:ring-blue-500" />
            <button @click="$store.mealConfig.addIngredient()"
                    class="bg-green-700 hover:bg-green-600 rounded-xl px-4 py-2 text-base transition-colors">+</button>
          </div>
        </div>
        <button @click="$store.mealConfig.open = false"
                class="mt-4 text-gray-500 hover:text-gray-300 text-sm transition-colors self-end">Schließen</button>
      </div>

    </div>
  </div>

  <!-- Four-panel layout -->
  <div class="flex flex-1 gap-4 p-4 min-h-0">

    <!-- Heute (30%) -->
    <div class="flex-[3] bg-gray-800 rounded-2xl p-6 flex flex-col min-h-0">
      <h2 class="text-3xl font-bold mb-4 text-blue-300">📅 Heute</h2>
      <div
        id="panel-wetter"
        hx-get="/api/weather"
        hx-trigger="load, every 300s"
        hx-swap="innerHTML"
        hx-headers='{"HX-Request": "true"}'
      ></div>
      <div
        id="panel-heute"
        class="flex-1 overflow-y-auto"
        hx-get="/api/today"
        hx-trigger="load, every 300s, refresh"
        hx-swap="innerHTML"
        hx-headers='{"HX-Request": "true"}'
      >
        <p class="text-xl text-gray-500 animate-pulse">Laden…</p>
      </div>
    </div>

    <!-- Diese Woche (30%) -->
    <div class="flex-[3] bg-gray-800 rounded-2xl p-6 flex flex-col min-h-0">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-3xl font-bold text-green-300">🗓 Diese Woche</h2>
        <button x-data @click="$store.mealConfig.openConfig()"
                class="text-gray-500 hover:text-gray-300 text-xl transition-colors" title="Mahlzeiten konfigurieren">⚙️</button>
      </div>
      <div
        id="panel-woche"
        class="flex-1 overflow-y-auto"
        hx-get="/api/week"
        hx-trigger="load, every 300s, refresh"
        hx-swap="innerHTML"
        hx-headers='{"HX-Request": "true"}'
      >
        <p class="text-xl text-gray-500 animate-pulse">Laden…</p>
      </div>
    </div>

    <!-- Einkauf (20%) -->
    <div class="flex-[2] bg-gray-800 rounded-2xl p-6 flex flex-col min-h-0">
      <h2 class="text-3xl font-bold mb-4 text-yellow-300">🛒 Einkauf</h2>
      <div
        id="panel-einkauf"
        class="flex-1 overflow-y-auto"
        hx-get="/api/grocery"
        hx-trigger="load, every 300s"
        hx-swap="innerHTML"
        hx-headers='{"HX-Request": "true"}'
      >
        <p class="text-xl text-gray-500 animate-pulse">Laden…</p>
      </div>
    </div>

    <!-- Notizen (20%) -->
    <div class="flex-[2] bg-gray-800 rounded-2xl p-6 flex flex-col min-h-0">
      <h2 class="text-3xl font-bold mb-4 text-pink-300">📌 Notizen</h2>
      <div
        id="panel-notizen"
        class="flex-1 overflow-y-auto"
        hx-get="/api/notes"
        hx-trigger="load, every 30s"
        hx-swap="innerHTML"
        hx-headers='{"HX-Request": "true"}'
      >
        <p class="text-lg text-gray-500 animate-pulse">Laden…</p>
      </div>
    </div>

  </div>

  <!-- Footer: last updated clock -->
  <div
    class="text-center text-gray-600 text-sm pb-3"
    x-data="{ time: '' }"
    x-init="
      const fmt = () => new Date().toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
      time = fmt();
      setInterval(() => time = fmt(), 60000);
    "
    x-cloak
  >
    Zuletzt aktualisiert: <span x-text="time"></span>
  </div>

</body>
</html>
