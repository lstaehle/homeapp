<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline — Familien-Dashboard</title>
  <style>
    body {
      background: #111827;
      color: #e5e7eb;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    h1 { font-size: 1.75rem; margin: 0.5rem 0; }
    p { color: #6b7280; margin: 0.25rem 0; }
    button {
      margin-top: 2rem;
      background: #1d4ed8;
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      cursor: pointer;
    }
    button:active { background: #1e40af; }
  </style>
</head>
<body>
  <div style="font-size:3.5rem">📡</div>
  <h1>Keine Verbindung</h1>
  <p>Das Dashboard benötigt eine Verbindung</p>
  <p>zum Heimnetzwerk.</p>
  <button onclick="location.reload()">Erneut versuchen</button>
</body>
</html>
